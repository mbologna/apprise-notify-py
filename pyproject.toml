[project]
name = "apprise-notify"
# publish.yml builds with the release tag's version instead, so this one
# only matters for a build from a checkout and may lag the tags.
version = "1.2.0"
description = "Send a notification to an Apprise API server: one function, standard library only"
readme = "README.md"
license = "MIT"
authors = [{ name = "Michele Bologna" }]
requires-python = ">=3.10"
dependencies = []
keywords = ["apprise", "notifications", "alerts"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: System :: Monitoring",
]

[project.urls]
Homepage = "https://github.com/mbologna/apprise-notify-py"
Repository = "https://github.com/mbologna/apprise-notify-py"
Issues = "https://github.com/mbologna/apprise-notify-py/issues"
Changelog = "https://github.com/mbologna/apprise-notify-py/releases"

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=9.0.3", "pytest-cov>=7.1.0", "ruff>=0.8.0"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --strict-markers"

[tool.coverage.run]
source = ["apprise_notify"]

[tool.uv]
required-version = ">=0.12.12"
exclude-newer = "7 days"
