[project]
name = "apprise-notify"
version = "1.1.1"
description = "Send a notification to an Apprise API server: one function, standard library only"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = []

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=9.0.3", "pytest-cov>=7.1.0", "ruff>=0.8.0"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --strict-markers"

[tool.coverage.run]
source = ["apprise_notify"]

[tool.uv]
required-version = ">=0.12.12"
exclude-newer = "7 days"
