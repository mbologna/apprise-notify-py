name: Publish to PyPI

# Builds the release tag and uploads it to PyPI with Trusted Publishing
# (OIDC): no API token is stored anywhere. PyPI checks this repository, this
# workflow file and the `pypi` environment against the project's trusted
# publisher.
#
# auto-release (ci.yml) pushes the tag with GITHUB_TOKEN, which triggers no
# `push` run, so it starts this workflow on the tag with workflow_dispatch. A
# tag pushed by hand starts it through `push`.

"on":
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    # A manual run on a branch has nothing to publish.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          python-version: "3.15"

      - name: Test
        run: |
          uv sync --locked
          uv run --locked pytest

      # auto-release tags without committing a version bump, so the tag is
      # the version's single source of truth.
      - name: Set the version from the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          uv version --frozen "${TAG#v}"

      - name: Build
        run: uv build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-26.04
    # The environment named in PyPI's trusted publisher.
    environment:
      name: pypi
      url: https://pypi.org/project/apprise-notify/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
