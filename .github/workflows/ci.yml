name: CI

"on":
  push:
    branches: ["**"]
    tags: ["v*.*.*"]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a run on the default branch: it may be releasing, and a cut
  # release leaves a tag without its Release.
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

permissions:
  contents: read

jobs:
  python:
    uses: mbologna/.github/.github/workflows/python-ci.yml@ee5bcf8cd73154eaccd48e386919f73d2dd832e2 # main
    with:
      python_version: "3.15"
      enable_codecov: false
    secrets: inherit

  auto-release:
    needs: [python]
    # contents: push the tag and create the Release; actions: start the PyPI
    # publish on it. A tag pushed with GITHUB_TOKEN triggers no `push` run,
    # so publish.yml is dispatched on the tag instead.
    permissions:
      contents: write
      actions: write
    uses: mbologna/.github/.github/workflows/auto-release.yml@ee5bcf8cd73154eaccd48e386919f73d2dd832e2 # main
    with:
      strategy: conventional
      dispatch_workflow: publish.yml
    secrets: inherit
