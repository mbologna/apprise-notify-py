name: CI

"on":
  push:
    branches: ["**"]
    tags: ["v*.*.*"]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a run on the default branch: it may be releasing, and a cut
  # release leaves a tag without its Release.
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

permissions:
  contents: read

jobs:
  python:
    uses: mbologna/.github/.github/workflows/python-ci.yml@581748d588a3d2a57a48d564a22b5cc4901d58c1 # main
    with:
      python_version: "3.14"
      use_uv: true
      enable_codecov: false
    secrets: inherit

  auto-release:
    # Monday's schedule releases when a feat, fix, perf, revert or breaking
    # commit landed since the last tag, and a manual run releases whatever is
    # unreleased; a push to the default branch releases only a CVE fix (the
    # wrapper switches to the security strategy). Consumers install a tag,
    # and nothing builds on one, so no tag build is dispatched.
    if: >-
      github.event_name == 'schedule' ||
      ((github.event_name == 'workflow_dispatch' || github.event_name == 'push') &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    needs: [python]
    # contents: push the tag and create the Release.
    permissions:
      contents: write
    uses: mbologna/.github/.github/workflows/auto-release.yml@581748d588a3d2a57a48d564a22b5cc4901d58c1 # main
    with:
      strategy: conventional
      dispatch_tag_build: false
    secrets: inherit
