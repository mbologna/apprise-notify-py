name: CI

"on":
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a run on the default branch: it may be releasing, and a cut
  # release leaves a tag without its Release.
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

permissions:
  contents: read

jobs:
  # ruff, the tests with the coverage gate (fail_under in pyproject.toml)
  # and pip-audit on the locked runtime dependencies.
  python:
    uses: mbologna/.github/.github/workflows/python-ci.yml@a3c72d5835a4634fd90416f79abf930e49d1d96b # main
    with:
      python_version: "3.15"
      enable_codecov: false
    secrets: inherit

  # Releases: Monday's schedule tags vX.Y.Z with a GitHub Release of the
  # commit subjects when a feat, fix, perf, revert or breaking commit
  # landed (or a maintenance release for dependency updates), and a push to
  # main tags only a fix(security) commit. publish.yml builds each tag and
  # publishes it to PyPI.
  auto-release:
    needs: [python]
    # contents: push the tag and create the Release; actions: start the PyPI
    # publish on it. A tag pushed with GITHUB_TOKEN triggers no `push` run,
    # so publish.yml is dispatched on the tag instead.
    permissions:
      contents: write
      actions: write
    uses: mbologna/.github/.github/workflows/auto-release.yml@a3c72d5835a4634fd90416f79abf930e49d1d96b # main
    with:
      strategy: conventional
      dispatch_workflow: publish.yml
    secrets: inherit
