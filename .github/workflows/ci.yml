name: CI

"on":
  push:
    branches: ["**"]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    uses: mbologna/.github/.github/workflows/python-ci.yml@31ef9e1806fb2404b1e83e71cdb3838a2c56b5c1 # main
    with:
      python_version: "3.14"
      use_uv: true
      enable_codecov: false
    secrets: inherit
